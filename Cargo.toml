[package]
name = "mcp-server-odoo"
version = "0.2.1"
edition = "2021"
description = "MCP server for Odoo 16+ (JSON/2 on 19+, classic JSON-RPC on 16-18) — connect Claude and any MCP client to your Odoo ERP"
license = "MIT"
repository = "https://github.com/fgribreau/mcp-odoo"
homepage = "https://github.com/fgribreau/mcp-odoo"
documentation = "https://github.com/fgribreau/mcp-odoo#readme"
readme = "README.md"
authors = ["François-Guillaume Ribreau <github@fgribreau.com>"]
keywords = ["mcp", "odoo", "claude", "ai", "erp"]
categories = ["command-line-utilities", "api-bindings"]
exclude = [".github/*", "release-plz.toml"]

[[bin]]
name = "mcp-server-odoo"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.12", features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
tokio-util = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
glob-match = "0.2"
regex = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2"
pulldown-cmark = "0.12"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }

[features]
integration = []

[profile.release]
lto = true
codegen-units = 1
strip = true
